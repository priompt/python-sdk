[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is a placeholder — the import name stays `priompt`
# (`from priompt import PromptClient`) regardless of what this is published as.
name = "priompt-client-TBD"
version = "0.7.0"
description = "Python client for Priompt — versioned prompt serving over gRPC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["grpcio>=1.60", "protobuf>=7.35"]

[project.optional-dependencies]
nats = ["nats-py>=2.0"]   # only needed for PromptClient.subscribe()

[tool.setuptools]
packages = ["priompt", "priompt.v1"]

# Publishes on a v* tag only — merging this file uploads nothing.
# Before the first real release: set the final dist name in pyproject.toml and
# configure PyPI Trusted Publishing for this repo (or add a PYPI_API_TOKEN secret).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write            # PyPI Trusted Publishing (OIDC) — no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
